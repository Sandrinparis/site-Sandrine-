}

.hero-inner {

.tag {

}

/* BOUTONS */
.buttons {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.btn {
    display: inline-block;
    padding: 13px 24px;
    border-radius: 30px;
    background: #e6a8cc;
    color: #171018;
    font-weight: bold;
    border: none;
    cursor: pointer;
}

.btn.alt {
    background: transparent;
    border: 1px solid #666;
    color: #fff;
}

/* SECTIONS */
section {
    padding: 90px 20px;
}

.container {
    max-width: 1100px;

}

.title h2 {
    font-size: 38px;
    margin-bottom: 8px;
}

.title p {
    color: #999;
}

/* A PROPOS */
.about {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 35px;
}

.card {
    background: #15151b;
    border: 1px solid #292932;
    border-radius: 20px;
    padding: 28px;
}

.card p {
    color: #c8c5c9;
}

.facts div {
    padding: 14px 0;
    border-bottom: 1px solid #292932;
}

.facts div:last-child {
    border: none;
}

.facts strong {
    display: block;
    color: #e6a8cc;
}

/* GALERIE */
.gallery {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.photo {
    aspect-ratio: 3 / 4;
    border-radius: 16px;
    overflow: hidden;
    background: #191920;
    border: 1px solid #292932;
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* TARIFS */
.prices {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.price {
    background: #15151b;
    border: 1px solid #292932;
    border-radius: 18px;
    padding: 22px;
    text-align: center;
}

.amount {
    font-size: 25px;
    font-weight: bold;
    color: #e6a8cc;
    margin-top: 7px;
}

/* RESERVATION */

    gap: 25px;
}
